## Use embedded H2 for development by default (avoids external MySQL setup)
spring.datasource.url=jdbc:h2:mem:tn_farmer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.port=8080

# JWT secret (replace in production with env var)
jwt.secret=VerySecretJwtKeyChangeMe
jwt.expiration=86400000

# To use MySQL, replace the datasource URL and credentials above and remove H2 dependency.
# Example MySQL config (commented):
# spring.datasource.url=jdbc:mysql://localhost:3306/tn_farmer?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=changeme
